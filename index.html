<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Adaptive English training for workplace and product interviews." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <title>English Training Lab</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ADAPTIVE ENGLISH TRAINING</p>
        <h1>English Training Lab</h1>
      </div>
      <button id="exportBtn" class="ghost-btn" type="button">匯出紀錄</button>
    </header>

    <section id="homeView" class="view">
      <div class="hero-card">
        <p class="eyebrow">TODAY</p>
        <h2>先找漏洞，再把英文變成主動能力。</h2>
        <p class="muted">題目會依答題紀錄調整，混合 A2–B2、一般職場與 Product / PM 情境。</p>
        <div class="hero-actions">
          <button id="startBtn" class="primary-btn" type="button">開始今日訓練</button>
          <button id="diagnosticBtn" class="secondary-btn" type="button">跑弱點診斷</button>
        </div>
      </div>

      <div class="stats-grid">
        <article class="stat-card"><span>累積作答</span><strong id="totalAnswered">0</strong></article>
        <article class="stat-card"><span>整體正確率</span><strong id="overallAccuracy">—</strong></article>
        <article class="stat-card"><span>平均反應</span><strong id="avgResponse">—</strong></article>
        <article class="stat-card"><span>待補弱點</span><strong id="weakCount">0</strong></article>
      </div>

      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">WEAKNESS RADAR</p>
            <h3>目前最需要補的地方</h3>
          </div>
          <span id="dataStatus" class="pill">尚無資料</span>
        </div>
        <div id="weaknessList" class="weakness-list empty-state">完成第一輪作答後，這裡會開始顯示弱點。</div>
      </section>
    </section>

    <section id="quizView" class="view hidden">
      <div class="quiz-meta">
        <button id="quitBtn" class="text-btn" type="button">← 返回</button>
        <div class="progress-wrap">
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          <span id="progressText">1 / 20</span>
        </div>
      </div>

      <article class="question-card">
        <div class="question-tags" id="questionTags"></div>
        <p id="questionContext" class="context"></p>
        <h2 id="questionPrompt" class="question-prompt"></h2>
        <div id="answerArea"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="quiz-actions">
          <button id="submitBtn" class="primary-btn" type="button">確認答案</button>
          <button id="nextBtn" class="primary-btn hidden" type="button">下一題</button>
        </div>
      </article>
    </section>

    <section id="resultView" class="view hidden">
      <article class="hero-card result-card">
        <p class="eyebrow">SESSION COMPLETE</p>
        <h2>這輪完成了。</h2>
        <div class="result-score"><strong id="sessionAccuracy">0%</strong><span id="sessionSummary"></span></div>
        <div id="sessionInsights" class="insight-list"></div>
        <div class="hero-actions">
          <button id="backHomeBtn" class="primary-btn" type="button">查看弱點</button>
          <button id="exportResultBtn" class="secondary-btn" type="button">匯出今天紀錄</button>
        </div>
      </article>
    </section>
  </main>

  <script src="./js/questions.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
